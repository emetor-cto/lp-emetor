services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # expose: porta só na rede Docker (Coolify/Traefik enxergam assim).
    # ports: publica no host — é isso que o Docker Desktop mostra na coluna "Port(s)".
    expose:
      - "80"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
