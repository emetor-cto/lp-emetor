services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Porta de host incomum para reduzir conflito com outros serviços (ex.: 8080).
    # Coolify costuma usar a rede interna (expose: 80); o mapeamento 8077 ajuda em testes locais.
    expose:
      - "80"
    ports:
      - "8077:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
